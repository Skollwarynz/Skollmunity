<header class="site-header">
  <div class="header-inner container">
    <div class="brand">
      <a href="{{ '/' | relative_url }}" class="brand-link">
        <img src="{{ '/assets/images/2023/11/SPHERE.png' | relative_url }}" alt="{{ site.title }} logo" class="brand-logo">
        <div class="brand-text">
          <div class="brand-title-wrap">
            <span class="brand-badge-tag">SKOLL</span>
            <span class="brand-title">{{ site.title }}</span>
          </div>
          <span class="brand-tagline">{{ site.tagline }}</span>
        </div>
      </a>
    </div>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="site-nav" id="siteNav">
      <ul class="nav-list">
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
        <li><a href="{{ '/categories/' | relative_url }}" {% if page.url contains '/categories' %}class="active"{% endif %}>Categories</a></li>
        <li><a href="{{ '/art/' | relative_url }}" {% if page.url == '/art/' %}class="active"{% endif %}>Art</a></li>
        <li><a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}class="active"{% endif %}>About</a></li>
        <li><a href="https://skollwarynz.github.io" target="_blank" rel="noopener" class="nav-portfolio-link">Portfolio &rarr;</a></li>
      </ul>
    </nav>
  </div>
</header>
