---
layout: default
---

<article class="page-single">
  <div class="page-header-wrapper">
    <div class="container narrow-container">
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.subtitle %}
      <p class="page-subtitle">{{ page.subtitle }}</p>
      {% endif %}
    </div>
  </div>

  {% if page.image %}
  <div class="page-hero-image-wrap">
    <div class="container narrow-container">
      <a href="{{ page.image | relative_url }}" target="_blank" rel="noopener noreferrer" title="Open image asset">
        <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="page-hero-image">
      </a>
    </div>
  </div>
  {% endif %}

  <div class="container narrow-container">
    <div class="page-body">
      {{ content }}
    </div>
  </div>
</article>
